name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BreachIn.slnx

      - name: Build
        run: dotnet build BreachIn.slnx --configuration Release --no-restore

      - name: Run tests
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f -name '*Tests.csproj')

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No test projects found; skipping tests."
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            dotnet test "$project" --configuration Release --no-restore
          done
